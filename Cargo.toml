[package]
name = "smtp-mcp-server"
version = "0.3.1"
edition = "2021"
description = "MCP (HTTP/SSE) SMTP email sending service with key auth, TLS, and low memory footprint"
license = "MIT"

[[bin]]
name = "smtp-mcp-server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
subtle = "2"
mime = "0.3"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder", "hostname"] }
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
futures-util = "0.3"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true